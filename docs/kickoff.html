<!DOCTYPE html>
<html lang="en" class="kickoff-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workshop Kickoff — Download and Unzip</title>
    <meta name="description" content="On your laptop: download the workshop ZIP, extract it, and open docs/index.html.">
    <meta name="author" content="ludenio">
    <meta name="theme-color" content="#14120b">
    <meta name="color-scheme" content="dark">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="styles.css">
</head>
<body class="kickoff-body">
<div class="wrap kickoff-wrap">

    <main class="kickoff-main">
        <header class="kickoff-hero">
            <p class="kickoff-badge">Get set up before we start</p>
            <img class="kickoff-mascot" src="Nikol.ai.svg" alt="" width="100" height="84">
            <h1 class="kickoff-title">Game Development with AI Agents</h1>
        </header>

        <section class="kickoff-panel" aria-label="Workshop setup">
            <p class="kickoff-cue">On your laptop — type this in the browser</p>
            <a class="kickoff-url" href="https://bit.ly/ai_agents_workshop" target="_blank" rel="noopener noreferrer">bit.ly/ai_agents_workshop</a>
        </section>

        <ol class="kickoff-steps" aria-label="Setup steps">
            <li>
                <span class="kickoff-step-num">01</span>
                <strong>Download the ZIP</strong>
                <span class="kickoff-step-sub">from the link above</span>
            </li>
            <li>
                <span class="kickoff-step-num">02</span>
                <strong>Unzip it</strong>
                <span class="kickoff-step-sub">anywhere is fine</span>
            </li>
            <li>
                <span class="kickoff-step-num">03</span>
                <strong>Open <code>docs/index.html</code></strong>
                <span class="kickoff-step-sub">in your browser</span>
            </li>
        </ol>
    </main>

</div>
<script>
;(function () {
    'use strict'

    function fitKickoffUrl() {
        var url = document.querySelector('.kickoff-url')
        var wrap = document.querySelector('.kickoff-wrap')
        if (!url || !wrap) return

        var maxW = wrap.clientWidth
        if (maxW <= 0) return

        var maxH = Math.floor(window.innerHeight * 0.14)
        var lo = 12
        var hi = Math.min(300, maxH)
        var best = lo

        while (lo <= hi) {
            var mid = (lo + hi) >> 1
            url.style.fontSize = mid + 'px'
            if (url.scrollWidth <= maxW) {
                best = mid
                lo = mid + 1
            } else {
                hi = mid - 1
            }
        }

        url.style.fontSize = best + 'px'
    }

    function init() {
        fitKickoffUrl()
        window.addEventListener('resize', fitKickoffUrl)

        var wrap = document.querySelector('.kickoff-wrap')
        if (window.ResizeObserver && wrap) {
            new ResizeObserver(fitKickoffUrl).observe(wrap)
        }

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(fitKickoffUrl)
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init)
    } else {
        init()
    }
})()
</script>
</body>
</html>
